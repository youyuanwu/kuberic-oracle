[package]
name = "kuberic-oracle-tests"
description = "Integration and future live-test infrastructure for kuberic-oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
kuberic = [
    "dep:async-trait",
    "dep:kuberic-runtime",
    "dep:tokio",
    "dep:tonic",
    "kuberic-oracle/kuberic",
]

[dependencies]
async-trait = { workspace = true, optional = true }
kuberic-oracle.workspace = true
kuberic-runtime = { workspace = true, features = ["testing"], optional = true }
libc.workspace = true
oracledb.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
