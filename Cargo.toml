[workspace]
members = [
    "crates/kuberic-oracle",
    "crates/kuberic-oracle-tests",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/youyuanwu/kuberic-oracle"
rust-version = "1.98"
publish = false

[workspace.dependencies]
kuberic-oracle = { path = "crates/kuberic-oracle" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
