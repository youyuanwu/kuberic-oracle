[workspace]
members = [
    "crates/kuberic-oracle",
    "crates/kuberic-oracle-tests",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/youyuanwu/kuberic-oracle"
rust-version = "1.98"
publish = false

[workspace.dependencies]
async-trait = "0.1"
kuberic-oracle = { path = "crates/kuberic-oracle" }
kuberic-runtime = { git = "https://github.com/youyuanwu/kuberic.git", rev = "28b181bb1846d057cce5913513a46ed72de4c977", default-features = false, features = ["host"] }
libc = "0.2"
oracledb = "=26.0.0-beta.4"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
zeroize = { version = "1", features = ["derive"] }
